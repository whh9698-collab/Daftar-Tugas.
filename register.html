<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh
        }

        .card {
            width: 360px;
            background: #fff;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .2)
        }
    </style>
</head>

<body>
    <div class="card">
        <h3 class="text-center mb-3">Daftar Akun</h3>
        <form id="registerForm">
            <input id="nama" class="form-control mb-2" placeholder="Nama Lengkap" required>
            <input id="username" class="form-control mb-2" placeholder="Username" required>
            <input id="email" type="email" class="form-control mb-2" placeholder="Email" required>
            <input id="password" type="password" class="form-control mb-2" placeholder="Password" required>
            <input id="confirmPassword" type="password" class="form-control mb-3" placeholder="Konfirmasi Password"
                required>
            <button class="btn btn-primary w-100" type="submit">Daftar Sekarang</button>
        </form>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const nama = document.getElementById('nama').value.trim();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;
            if (password !== confirm) { Swal.fire('Gagal', 'Konfirmasi password tidak cocok', 'error'); return; }
            let users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.some(u => u.username === username)) { Swal.fire('Gagal', 'Username sudah digunakan', 'error'); return; }
            const user = { nama, username, email, password };
            users.push(user);
            localStorage.setItem('users', JSON.stringify(users));
            localStorage.setItem('currentUser', JSON.stringify(user));
            Swal.fire({ icon: 'success', title: 'Pendaftaran Berhasil', text: 'Akun berhasil dibuat. Anda akan masuk ke Dashboard.', confirmButtonText: 'Masuk ke Dashboard' }).then(() => {
                location.href = 'dashboard.html';
            });
        });
    </script>
</body>

</html>
