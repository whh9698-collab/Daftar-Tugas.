<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tambah Tugas | Student Task Manager</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {

            background: #f5f7fb;

        }

        a {

            text-decoration: none;

        }

        /* ==========================
            SIDEBAR
        ========================== */

        .sidebar {

            position: fixed;

            left: 0;

            top: 0;

            width: 250px;

            height: 100vh;

            background: #4F46E5;

            color: #fff;

            box-shadow: 5px 0 20px rgba(0, 0, 0, .15);

            z-index: 1000;

        }

        .logo {

            text-align: center;

            padding: 25px;

            font-size: 24px;

            font-weight: 700;

            border-bottom: 1px solid rgba(255, 255, 255, .2);

        }

        .logo i {

            margin-right: 10px;

        }

        .sidebar ul {

            list-style: none;

            padding: 20px 0;

        }

        .sidebar ul li {

            margin: 8px 15px;

        }

        .sidebar ul li a {

            display: block;

            color: white;

            padding: 14px 18px;

            border-radius: 12px;

            transition: .3s;

        }

        .sidebar ul li a:hover {

            background: white;

            color: #4F46E5;

        }

        .sidebar ul li a i {

            width: 28px;

        }

        /* ==========================
            CONTENT
        ========================== */

        .content {

            margin-left: 250px;

            min-height: 100vh;

        }

        /* ==========================
            NAVBAR
        ========================== */

        .topbar {

            background: #fff;

            padding: 18px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow: 0 5px 15px rgba(0, 0, 0, .08);

        }

        .topbar h4 {

            margin: 0;

            font-weight: 600;

        }

        .user-box {

            display: flex;

            align-items: center;

            gap: 15px;

        }

        .user-box img {

            width: 45px;

            height: 45px;

            border-radius: 50%;

        }

        .user-name {

            font-weight: 600;

        }

        /* ==========================
            PAGE HEADER
        ========================== */

        .page-header {

            padding: 35px;

        }

        .page-header h2 {

            font-weight: 700;

            color: #333;

        }

        .page-header p {

            color: #666;

        }

        /* ==========================
            CARD
        ========================== */

        .card-custom {

            border: none;

            border-radius: 18px;

            box-shadow: 0 10px 25px rgba(0, 0, 0, .08);

        }

        .card-header {

            background: #fff;

            font-weight: 600;

            font-size: 18px;

        }

        /* ==========================
            FORM
        ========================== */

        .form-control,
        .form-select {

            border-radius: 12px;

            height: 50px;

        }

        textarea.form-control {

            height: 130px;

            resize: none;

        }

        .form-control:focus,
        .form-select:focus {

            border-color: #4F46E5;

            box-shadow: 0 0 0 .15rem rgba(79, 70, 229, .25);

        }

        .btn-save {

            background: #4F46E5;

            color: white;

            border: none;

            border-radius: 12px;

            padding: 12px 30px;

            font-weight: 600;

        }

        .btn-save:hover {

            background: #3730A3;

            color: white;

        }

        .btn-back {

            border-radius: 12px;

            padding: 12px 30px;

            font-weight: 600;

        }

        @media(max-width:992px) {

            .sidebar {

                width: 90px;

            }

            .logo span {

                display: none;

            }

            .sidebar ul li a span {

                display: none;

            }

            .content {

                margin-left: 90px;

            }

        }

        @media(max-width:768px) {

            .sidebar {

                display: none;

            }

            .content {

                margin-left: 0;

            }

        }
    </style>

</head>

<body>
    <!-- ==========================
        SIDEBAR
========================== -->

    <div class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-book-open"></i>

            <span>STM</span>

        </div>

        <ul>

            <li>

                <a href="dashboard.html">

                    <i class="fa-solid fa-house"></i>

                    <span>Dashboard</span>

                </a>

            </li>

            <li>

                <a href="tambah_tugas.html">

                    <i class="fa-solid fa-plus"></i>

                    <span>Tambah Tugas</span>

                </a>

            </li>

            <li>

                <a href="daftar_tugas.html">

                    <i class="fa-solid fa-list-check"></i>

                    <span>Daftar Tugas</span>

                </a>

            </li>

            <li>

                <a href="profil.html">

                    <i class="fa-solid fa-user"></i>

                    <span>Profil</span>

                </a>

            </li>

            <li>

                <a href="#" id="logoutBtn">

                    <i class="fa-solid fa-right-from-bracket"></i>

                    <span>Logout</span>

                </a>

            </li>

        </ul>

    </div>

    <!-- ==========================
        CONTENT
========================== -->

    <div class="content">

        <!-- NAVBAR -->

        <div class="topbar">

            <h4>

                Student Task Manager

            </h4>

            <div class="user-box">

                <img src="https://ui-avatars.com/api/?name=User&background=4F46E5&color=ffffff" alt="Avatar">

                <div>

                    <div class="user-name" id="namaUser">

                        Loading...

                    </div>

                    <small id="tanggalHari">

                        Loading...

                    </small>

                </div>

            </div>

        </div>

        <!-- HEADER -->

        <div class="page-header">

            <h2>

                <i class="fa-solid fa-circle-plus text-primary"></i>

                Tambah Tugas

            </h2>

            <p>

                Tambahkan tugas baru agar lebih mudah mengatur deadline perkuliahan.

            </p>

        </div>

        <!-- FORM CARD -->

        <div class="container-fluid px-4">

            <div class="card card-custom">

                <div class="card-header">

                    <i class="fa-solid fa-pen-to-square"></i>

                    Form Tambah Tugas

                </div>

                <div class="card-body">

                    <form id="taskForm">

                        <div class="row">

                            <!-- Judul -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Judul Tugas

                                </label>

                                <input type="text" id="judul" class="form-control"
                                    placeholder="Contoh : Membuat Website" required>

                            </div>

                            <!-- Mata Kuliah -->

                            <div class="col-md-6 mb-3">

                                <label class="form-label">

                                    Mata Kuliah

                                </label>

                                <input type="text" id="matkul" class="form-control"
                                    placeholder="Contoh : Pemrograman Web" required>

                            </div>
                            <!-- Deskripsi -->

                            <div class="col-12 mb-3">

                                <label class="form-label">

                                    Deskripsi Tugas

                                </label>

                                <textarea id="deskripsi" class="form-control" placeholder="Tuliskan deskripsi tugas..."
                                    required></textarea>

                            </div>

                            <!-- Prioritas -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">

                                    Prioritas

                                </label>

                                <select id="prioritas" class="form-select" required>

                                    <option value="">-- Pilih Prioritas --</option>

                                    <option value="Rendah">

                                        🟢 Rendah

                                    </option>

                                    <option value="Sedang">

                                        🟡 Sedang

                                    </option>

                                    <option value="Tinggi">

                                        🔴 Tinggi

                                    </option>

                                </select>

                            </div>

                            <!-- Deadline -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">

                                    Deadline

                                </label>

                                <input type="date" id="deadline" class="form-control" required>

                            </div>

                            <!-- Status -->

                            <div class="col-md-4 mb-3">

                                <label class="form-label">

                                    Status

                                </label>

                                <select id="status" class="form-select">

                                    <option value="Belum Selesai">

                                        Belum Selesai

                                    </option>

                                    <option value="Selesai">

                                        Selesai

                                    </option>

                                </select>

                            </div>

                        </div>

                        <hr>

                        <div class="d-flex justify-content-between">

                            <a href="dashboard.html" class="btn btn-secondary btn-back">

                                <i class="fa-solid fa-arrow-left"></i>

                                Kembali

                            </a>

                            <button type="submit" class="btn btn-save">

                                <i class="fa-solid fa-floppy-disk"></i>

                                Simpan Tugas

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 -->

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>

        /* ==========================================
           CEK SESSION LOGIN
        ========================================== */

        const currentUser = JSON.parse(localStorage.getItem("currentUser"));

        if (!currentUser) {

            Swal.fire({
                icon: "warning",
                title: "Silakan Login",
                text: "Anda harus login terlebih dahulu."
            }).then(() => {

                window.location.href = "index.html";

            });

        }

        /* ==========================================
           TAMPILKAN NAMA USER
        ========================================== */

        document.getElementById("namaUser").innerHTML =
            currentUser.nama;


        /* ==========================================
           TANGGAL HARI INI
        ========================================== */

        const hariIni = new Date();

        document.getElementById("tanggalHari").innerHTML =
            hariIni.toLocaleDateString("id-ID", {

                weekday: "long",

                day: "numeric",

                month: "long",

                year: "numeric"

            });


        /* ==========================================
           FORM TAMBAH TUGAS
        ========================================== */

        const form = document.getElementById("taskForm");

        form.addEventListener("submit", function (e) {

            e.preventDefault();

            const judul =
                document.getElementById("judul").value.trim();

            const matkul =
                document.getElementById("matkul").value.trim();

            const deskripsi =
                document.getElementById("deskripsi").value.trim();

            const prioritas =
                document.getElementById("prioritas").value;

            const deadline =
                document.getElementById("deadline").value;

            const status =
                document.getElementById("status").value;

            if (

                judul === "" ||

                matkul === "" ||

                deskripsi === "" ||

                prioritas === "" ||

                deadline === ""

            ) {

                Swal.fire({

                    icon: "warning",

                    title: "Form Belum Lengkap",

                    text: "Silakan lengkapi semua data."

                });

                return;

            }

            let tasks =
                JSON.parse(localStorage.getItem("tasks")) || [];

            const tugasBaru = {

                id: Date.now(),

                username: currentUser.username,

                judul: judul,

                matkul: matkul,

                deskripsi: deskripsi,

                prioritas: prioritas,

                deadline: deadline,

                status: status,

                dibuat: new Date().toLocaleString("id-ID")

            };
            /* ==========================================
   SIMPAN KE LOCALSTORAGE
========================================== */

            tasks.push(tugasBaru);

            localStorage.setItem("tasks", JSON.stringify(tasks));

            Swal.fire({

                icon: "success",

                title: "Berhasil",

                text: "Tugas berhasil ditambahkan.",

                confirmButtonColor: "#4F46E5"

            }).then(() => {

                window.location.href = "daftar_tugas.html";

            });

        });


        /* ==========================================
           LOGOUT
        ========================================== */

        document.getElementById("logoutBtn")

            .addEventListener("click", function (e) {

                e.preventDefault();

                Swal.fire({

                    title: "Logout",

                    text: "Apakah Anda yakin ingin logout?",

                    icon: "question",

                    showCancelButton: true,

                    confirmButtonText: "Logout",

                    cancelButtonText: "Batal",

                    confirmButtonColor: "#dc3545"

                })

                    .then((result) => {

                        if (result.isConfirmed) {

                            localStorage.removeItem("currentUser");

                            Swal.fire({

                                icon: "success",

                                title: "Logout Berhasil",

                                timer: 1200,

                                showConfirmButton: false

                            }).then(() => {

                                window.location.href = "index.html";

                            });

                        }

                    });

            });

    </script>

</body>

</html>
